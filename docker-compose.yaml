services:
    app:
        build: .
        container_name: app
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_DB}?schema=public
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:17-alpine
        container_name: db
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_DB}
        ports:
            - "${DATABASE_PORT}:5432"
        volumes:
            - mvg_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    mvg_db_data:
