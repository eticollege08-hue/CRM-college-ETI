name: CI

on:
    push:
        branches: [main, staging]
    pull_request:
        branches: [main, staging]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  persist-credentials: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Format pull request
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
              run: npm run format
            - name: Check formatting
              run: npx prettier --check .
            - run: npx prisma generate --allow-no-models
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npm run test:typecheck
            # Розкоментувати після появи перших файлів тестів.
            # - run: npm test
            - name: Commit formatting changes
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
              env:
                  PR_BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  git add --update
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "style: format with Prettier"
                  git push origin "HEAD:refs/heads/$PR_BRANCH"
