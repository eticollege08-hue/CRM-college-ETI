openapi: 3.0.3
info:
    title: CRM API
    version: 0.3.0
    description: "Login/logout use UserAccount and JWT cookies. All API errors use { success: false,
        message, details }. Public self-registration is unavailable."
    license:
        name: Proprietary
servers:
    - url: /api
      description: API on the application origin
tags:
    - name: Auth
      description: Account login and logout
    - name: Employees
      description: Employee profiles (development only)
paths:
    /auth/login:
        post:
            tags:
                - Auth
            operationId: login
            summary: Sign in
            security: []
            description:
                Uses UserAccount only. Email is trimmed/lowercased; passwords are unchanged. Missing
                accounts, wrong passwords and inactive accounts produce identical 401 responses. No
                public registration. A stale /api cookie is cleared before setting the root cookie.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
                        example:
                            email: olena@example.com
                            password: ExamplePassword123!
            responses:
                "200":
                    description: Signed in successfully.
                    headers:
                        Set-Cookie:
                            required: true
                            description: Separate Set-Cookie headers; Secure is omitted only for local HTTP development.
                            schema:
                                type: array
                                items:
                                    type: string
                            example:
                                - crm_access_token=; Path=/api; Expires=Thu, 01 Jan 1970 00:00:00
                                  GMT; HttpOnly; Secure; SameSite=Lax
                                - crm_access_token=example-token-not-a-real-credential; Path=/;
                                  Max-Age=3600; HttpOnly; Secure; SameSite=Lax
                        Cache-Control:
                            $ref: "#/components/headers/NoStore"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthSuccess"
                            example:
                                success: true
                                message: Signed in successfully.
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/LoginUnauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "413":
                    $ref: "#/components/responses/PayloadTooLarge"
                "415":
                    $ref: "#/components/responses/UnsupportedMediaType"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "429":
                    $ref: "#/components/responses/TooManyAttempts"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /auth/logout:
        post:
            tags:
                - Auth
            operationId: logout
            summary: Sign out
            description:
                After JWT verification, clears cookies at / and the legacy /api path. No server-side
                token revocation; a copied token remains usable until expiry. No body is needed;
                parsed bodies are ignored. Without a cookie, repeated logout returns 401.
            security:
                - cookieAuth: []
            responses:
                "200":
                    description: Signed out successfully.
                    headers:
                        Set-Cookie:
                            required: true
                            description: Separate Set-Cookie headers; Secure is omitted only for local HTTP development.
                            schema:
                                type: array
                                items:
                                    type: string
                            example:
                                - crm_access_token=; Path=/api; Expires=Thu, 01 Jan 1970 00:00:00
                                  GMT; HttpOnly; Secure; SameSite=Lax
                                - crm_access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT;
                                  HttpOnly; Secure; SameSite=Lax
                        Cache-Control:
                            $ref: "#/components/headers/NoStore"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthSuccess"
                            example:
                                success: true
                                message: Signed out successfully.
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Missing, invalid or expired JWT; both cookie paths are cleared.
                    headers:
                        Set-Cookie:
                            required: true
                            description: Separate Set-Cookie headers; Secure is omitted only for local HTTP development.
                            schema:
                                type: array
                                items:
                                    type: string
                            example:
                                - crm_access_token=; Path=/api; Expires=Thu, 01 Jan 1970 00:00:00
                                  GMT; HttpOnly; Secure; SameSite=Lax
                                - crm_access_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT;
                                  HttpOnly; Secure; SameSite=Lax
                        Cache-Control:
                            $ref: "#/components/headers/NoStore"
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                            examples:
                                unauthorized:
                                    value:
                                        success: false
                                        message: Authentication is required.
                                        details: []
                                expired:
                                    value:
                                        success: false
                                        message: Your session is no longer valid. Please sign in again.
                                        details: []
                "403":
                    $ref: "#/components/responses/Forbidden"
                "413":
                    $ref: "#/components/responses/PayloadTooLarge"
                "415":
                    $ref: "#/components/responses/UnsupportedMediaType"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /employees:
        get:
            tags:
                - Employees
            operationId: getEmployees
            summary: List employees (development only)
            security: []
            responses:
                "200":
                    description: Employees returned.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - employees
                                properties:
                                    success:
                                        type: boolean
                                        enum:
                                            - true
                                    employees:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/Employee"
                "403":
                    $ref: "#/components/responses/DevelopmentOnly"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        post:
            tags:
                - Employees
            operationId: createEmployee
            summary: Create an employee (development only)
            description: Every profile field is optional, including all fields together.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EmployeeInput"
            responses:
                "201":
                    description: Employee created without requiring a user account.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - employee
                                properties:
                                    success:
                                        type: boolean
                                        enum:
                                            - true
                                    message:
                                        type: string
                                    employee:
                                        $ref: "#/components/schemas/Employee"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/DevelopmentOnly"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalServerError"
    /employees/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
                  format: uuid
        get:
            tags:
                - Employees
            operationId: getEmployee
            summary: Get an employee (development only)
            security: []
            responses:
                "200":
                    description: Employee returned.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - employee
                                properties:
                                    success:
                                        type: boolean
                                        enum:
                                            - true
                                    employee:
                                        $ref: "#/components/schemas/Employee"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/DevelopmentOnly"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        patch:
            tags:
                - Employees
            operationId: updateEmployee
            summary: Update an employee (development only)
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/EmployeeUpdateInput"
            responses:
                "200":
                    description: Employee updated.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                    - employee
                                properties:
                                    success:
                                        type: boolean
                                        enum:
                                            - true
                                    message:
                                        type: string
                                    employee:
                                        $ref: "#/components/schemas/Employee"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/DevelopmentOnly"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalServerError"
        delete:
            tags:
                - Employees
            operationId: deleteEmployee
            summary: Delete an employee (development only)
            security: []
            responses:
                "200":
                    description: Employee deleted.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - message
                                properties:
                                    success:
                                        type: boolean
                                        enum:
                                            - true
                                    message:
                                        type: string
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/DevelopmentOnly"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "500":
                    $ref: "#/components/responses/InternalServerError"
components:
    headers:
        NoStore:
            required: true
            description: Do not cache authentication responses.
            schema:
                type: string
                enum: [no-store]
            example: no-store
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: crm_access_token
            description:
                "JWT in HttpOnly cookie only; never in JSON or Authorization. Path=/; SameSite=Lax;
                host-only. Secure defaults to true and can be disabled only for local development.
                Max-Age equals JWT_EXPIRES_IN (default 3600 seconds). JWT claims use UserAccount ID
                and Prisma Role. Auth POST requests require an exact allowed Origin; Referer is not
                used. Use credentials: include / withCredentials: true. Deploy same-origin, or
                explicitly configure credentialed CORS for separate origins."
    schemas:
        Employee:
            type: object
            required:
                - id
                - fullName
                - imageId
                - level
                - position
            properties:
                id:
                    type: string
                    format: uuid
                    readOnly: true
                fullName:
                    type: string
                    nullable: true
                imageId:
                    type: string
                    nullable: true
                level:
                    type: string
                    nullable: true
                position:
                    type: string
                    nullable: true
        EmployeeInput:
            type: object
            additionalProperties: false
            properties:
                fullName:
                    type: string
                    minLength: 1
                imageId:
                    type: string
                    minLength: 1
                level:
                    type: string
                    minLength: 1
                position:
                    type: string
                    minLength: 1
        EmployeeUpdateInput:
            type: object
            additionalProperties: false
            properties:
                fullName:
                    type: string
                    minLength: 1
                imageId:
                    type: string
                    minLength: 1
                    nullable: true
                level:
                    type: string
                    minLength: 1
                position:
                    type: string
                    minLength: 1
        AuthSuccess:
            type: object
            additionalProperties: false
            required:
                - success
                - message
            properties:
                success:
                    type: boolean
                    enum:
                        - true
                message:
                    type: string
        LoginRequest:
            type: object
            additionalProperties: false
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 254
                    description: Trim and lowercase.
                password:
                    type: string
                    format: password
                    writeOnly: true
                    minLength: 1
                    maxLength: 72
                    description: At most 72 UTF-8 bytes. Do not trim or truncate.
        ErrorDetail:
            type: object
            additionalProperties: false
            required:
                - field
                - message
            properties:
                field:
                    type: string
                    minLength: 1
                message:
                    type: string
                    minLength: 1
        ErrorResponse:
            type: object
            additionalProperties: false
            required:
                - success
                - message
                - details
            properties:
                success:
                    type: boolean
                    enum:
                        - false
                message:
                    type: string
                    minLength: 1
                details:
                    type: array
                    items:
                        $ref: "#/components/schemas/ErrorDetail"
                    description: Field errors; [] if absent. No credentials or technical details.
    responses:
        BadRequest:
            description:
                Malformed JSON or a missing/non-object body for a validated endpoint. Standard
                express.json() may turn a zero-byte JSON body into {}; validation then returns 422.
                An empty Employee object is valid.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Invalid request.
                        details: []
        PayloadTooLarge:
            description: JSON body exceeds the default express.json() limit of 100 KiB.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Invalid request.
                        details: []
        UnsupportedMediaType:
            description: JSON parser rejected the charset or content encoding.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Invalid request.
                        details: []
        LoginUnauthorized:
            description: Wrong credentials, missing account or inactive account; identical response.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Invalid email or password.
                        details: []
        Forbidden:
            description: Origin is missing or not in the configured allowlist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: You do not have permission to perform this action.
                        details: []
        ValidationError:
            description:
                Invalid fields, UUID or unknown properties; all validators forward parsed Zod data on
                success. Auth {} reports missing fields. Employee {} is allowed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Please correct the highlighted fields.
                        details:
                            - field: email
                              message: Enter a valid email address.
        TooManyAttempts:
            description:
                Five failed attempts per normalized email + IP in a sliding 5-minute window by default;
                configurable. No waiting-time response metadata.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Too many attempts. Please try again later.
                        details: []
        InternalServerError:
            description: Unexpected failure; no internal details are exposed.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Internal server error.
                        details: []
        NotFound:
            description: Employee does not exist.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Співробітника не знайдено
                        details: []
        DevelopmentOnly:
            description: Employee routes are enabled only in development.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
                    example:
                        success: false
                        message: Маршрут доступний лише в середовищі розробки
                        details: []
