                "500":
                    $ref: "#/components/responses/InternalServerError"
        post:
            tags:
                - Hierarchy
            operationId: createHierarchyRelationship
            summary: Create a hierarchy relationship
            description:
                "Allowed roles: OWNER, RECRUITER, HR, MANAGER. employeeId is the manager; subordinateId is the
                subordinate. Multiple managers are allowed. Rejects self-assignment, duplicates and
                cycles. Checks and write share a Serializable transaction with up to three P2034
                attempts."
            security:
                - cookieAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/HierarchyCreateInput"
            responses:
                "201":
                    description: Hierarchy relationship created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/HierarchyWriteSuccess"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/HierarchyUnauthorized"
                "403":
                    $ref: "#/components/responses/HierarchyForbidden"
                "404":
                    $ref: "#/components/responses/HierarchyNotFound"
                "409":
                    $ref: "#/components/responses/HierarchyConflict"
                "413":
                    $ref: "#/components/responses/PayloadTooLarge"
                "415":
